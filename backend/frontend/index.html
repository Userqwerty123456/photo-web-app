<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Photo App</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <main class="app">

        <header class="topbar">
            <h1>📸 Photo App</h1>
        </header>

        <section class="camera-card">

            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>

            <div id="camera-placeholder" class="camera-placeholder">
                <span>📷</span>
                <p>Камера выключена</p>
            </div>

            <!-- Таймер робота -->
            <div id="robot-countdown" class="robot-countdown hidden">
                <div id="countdown-number">5</div>
                <div id="countdown-text">Селфи через 5 секунд...</div>
            </div>

            <!-- Вспышка после снимка -->
            <div id="robot-snapshot" class="robot-snapshot hidden">
                <div>📸</div>
                <span>СНИМОК!</span>
            </div>

        </section>

        <div class="camera-controls">

            <button id="startCamera" class="control-button primary">
                📷 Включить камеру
            </button>

            <button id="takePhoto" class="control-button primary hidden">
                ⭕ Сделать фото
            </button>

            <button id="switchCamera" class="control-button secondary hidden">
                🔄 Камера
            </button>

        </div>

        <!-- Предпросмотр -->
        <section id="preview" class="preview hidden">

            <h2>Предпросмотр</h2>

            <img id="previewImage" alt="Предпросмотр фото">

            <div class="preview-buttons">

                <button id="uploadPhoto" class="control-button primary">
                    ☁️ Сохранить
                </button>

                <button id="retakePhoto" class="control-button secondary">
                    ↩️ Переснять
                </button>

            </div>

        </section>

        <p id="status" class="status"></p>

        <!-- Галерея -->
        <section class="gallery">

            <h2>🖼 Фотографии</h2>

            <div id="gallery" class="gallery-grid"></div>

        </section>

    </main>

    <script src="/static/app.js"></script>

</body>

</html>
